name: Auto Update sing-box-reF1nd

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: update-sing-box-reF1nd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Upstream Revision
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REV=$(gh api repos/reF1nd/sing-box/branches/reF1nd-testing --jq '.commit.sha')
          CURRENT=$(jq -r '.nodes["sing-box-src"].locked.rev' flake.lock)
          if [ "$REV" = "$CURRENT" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.check.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch'
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids configurable-impure-env
            auto-allocate-uids = true

      - name: Setup Cachix
        if: steps.check.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch'
        uses: cachix/cachix-action@v15
        with:
          name: rxda-cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Update Source and Build
        if: steps.check.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          nix flake update sing-box-src --accept-flake-config
          TIMESTAMP=$(jq -r '.nodes["sing-box-src"].locked.lastModified' flake.lock)
          VERSION="unstable-$(date -u -d "@$TIMESTAMP" +%F)"
          sed -i "s|version = \".*\";|version = \"$VERSION\";|" flake.nix

          if ! nix build .#default --accept-flake-config --no-link > build.log 2>&1; then
            cat build.log
            NEW_HASH=$(sed -n 's/^[[:space:]]*got:[[:space:]]*\(sha256-[A-Za-z0-9+/=]*\)[[:space:]]*$/\1/p' build.log)
            if [ -z "$NEW_HASH" ] || [ "$(printf '%s\n' "$NEW_HASH" | wc -l)" -ne 1 ]; then
              exit 1
            fi
            sed -i "s|vendorHash = \"sha256-.*\";|vendorHash = \"$NEW_HASH\";|" flake.nix
          fi

          nix build .#default --accept-flake-config --print-build-logs
          ./result/bin/sing-box version
          nix flake check --accept-flake-config

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          if ! git diff --cached --quiet; then
            REV=$(jq -r '.nodes["sing-box-src"].locked.rev' flake.lock)
            git commit -m "chore: update sing-box-reF1nd to ${REV:0:12}"
            git push
          fi
